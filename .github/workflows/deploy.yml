# CD: a push to main → CI gate → images built and pushed to GHCR (tag = commit SHA) → deploy on the VPS
# over SSH (deploy/deploy.sh: backup, migrate, start, healthcheck, automatic rollback on failure).
#
# GitHub settings needed (Settings → Secrets and variables → Actions), see docs/DEPLOYMENT.md:
#   secrets:   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_HOST_FINGERPRINT (sha256 of the server host key)
#   variables: PUBLIC_API_URL  (e.g. https://api.example.uz/api - baked into the frontend build)
# Optional: Settings → Environments → "production" → required reviewers, to approve each deploy by hand.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Roll back to the previously deployed version instead of deploying"
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a half-finished deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !inputs.rollback }}
    uses: ./.github/workflows/ci.yml

  images:
    if: ${{ !inputs.rollback }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Registry name (lowercase)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Check the API address
        run: |
          [[ "${{ vars.PUBLIC_API_URL }}" =~ ^https://[^/]+/api$ ]] || { echo "Set the repository variable PUBLIC_API_URL, e.g. https://api.example.uz/api"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/e-avto-test-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          target: migrate
          push: true
          tags: ${{ env.REGISTRY }}/e-avto-test-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          build-args: VITE_API_URL=${{ vars.PUBLIC_API_URL }}
          tags: ${{ env.REGISTRY }}/e-avto-test-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    if: ${{ always() && (inputs.rollback || needs.images.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # Only the deploy files go to the server; secrets stay in the server's .env.production.
      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: "deploy/docker-compose.prod.yml,deploy/deploy.sh,deploy/Dockerfile.api,deploy/Dockerfile.web,deploy/nginx.conf.template,deploy/backup.sh,deploy/restore.sh"
          target: /opt/eavto
      - name: Deploy on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
          ROLLBACK: ${{ inputs.rollback && 'yes' || 'no' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: GHCR_USER,GHCR_TOKEN,TAG,ROLLBACK
          command_timeout: 15m
          script: |
            set -e
            cd /opt/eavto/deploy
            chmod +x deploy.sh backup.sh restore.sh
            # Short-lived token of this workflow run: pull access only, nothing stored for later.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            if [ "$ROLLBACK" = "yes" ]; then ./deploy.sh --rollback; else ./deploy.sh "$TAG"; fi
