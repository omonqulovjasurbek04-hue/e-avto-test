# CI: every push and pull request. Backend lint + types + tests on a real PostgreSQL, frontend lint + build.
# The Deploy workflow reuses this as its gate: nothing reaches the server unless it passes.
name: CI

on:
  push:
    branches-ignore: [main] # main runs it through deploy.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e_avto_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d e_avto_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e_avto_test_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e_avto_test_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      # Fails if schema.prisma and the migrations disagree (a forgotten migration). The shadow database is
      # wiped by Prisma, so it is a separate one.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE shadow"
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://postgres:postgres@localhost:5432/shadow" --exit-code
      - run: npx prisma migrate deploy
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Production build check (types + bundle). The real API address is baked in by the Deploy workflow.
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid/api
