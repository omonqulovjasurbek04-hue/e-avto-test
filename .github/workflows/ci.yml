# CI: every push and pull request. Backend lint + types + tests on a real PostgreSQL, frontend lint + build.
# The Deploy workflow reuses this as its gate: nothing reaches the server unless it passes.
name: CI

# Render deploys main only after these checks pass (render.yaml: autoDeployTrigger: checksPass).
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a feature branch cancels the older run there. Runs on main are never cancelled:
# Render waits for their result before deploying.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e_avto_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d e_avto_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e_avto_test_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e_avto_test_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      # Fails if schema.prisma and the migrations disagree (a forgotten migration). The shadow database is
      # wiped by Prisma, so it is a separate one.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE shadow"
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://postgres:postgres@localhost:5432/shadow" --exit-code
      - run: npx prisma migrate deploy
      - run: npm test

  # The production bootstrap (prisma/bootstrap.ts) on an empty database, twice: the catalogue and the
  # first administrator appear once, the second run changes nothing.
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bootstrap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bootstrap"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bootstrap?schema=public
      BOOTSTRAP_ADMIN_PHONE: "+998 90 111 22 33"
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-Passw0rd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/bootstrap.ts
      - run: npx tsx prisma/bootstrap.ts
      - name: Check the result
        run: |
          node -e '
            const { PrismaClient } = require("@prisma/client");
            const p = new PrismaClient();
            (async () => {
              const r = {
                courses: await p.course.count(),
                packages: await p.coursePackage.count(),
                textLessons: await p.lesson.count({ where: { content: { not: null } } }),
                admins: await p.user.count({ where: { role: "SUPERADMIN" } }),
              };
              console.log(r);
              await p.$disconnect();
              if (r.courses < 10 || r.packages < 1 || r.textLessons < 1 || r.admins !== 1) process.exit(1);
            })();
          '

  # The Railway image (deploy/Dockerfile.railway): builds, starts in production mode and serves both
  # the site and the API from one origin.
  railway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f deploy/Dockerfile.railway --build-arg VITE_API_URL=https://ci.example.invalid/api -t eavto-railway .
      - name: Start and probe
        run: |
          docker run -d --name app -p 8080:8080             -e PORT=8080             -e DATABASE_URL=postgresql://none:none@127.0.0.1:5432/none             -e JWT_SECRET=ci-only-0123456789abcdef0123456789abcdef             -e CLIENT_URL=https://ci.example.invalid             -e PUBLIC_API_ORIGIN=https://ci.example.invalid             eavto-railway
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health/live && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/health/live | grep -q alive
          curl -fsS -D headers.txt http://127.0.0.1:8080/courses -o page.html
          grep -q 'id="root"' page.html
          grep -qi "frame-src https://www.google.com" headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/nope)" = 404
      - name: Logs
        if: always()
        run: docker logs app || true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Production build check (types + bundle). The real API address is baked in by the Deploy workflow.
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid/api
