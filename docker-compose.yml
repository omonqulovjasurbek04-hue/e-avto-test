version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: e_avto_test_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e_avto_test
    ports:
      - "5432:5432"
    volumes:
      - e_avto_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d e_avto_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  e_avto_test_pgdata:
