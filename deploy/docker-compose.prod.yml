# Production stack: PostgreSQL (private network only), Redis (shared rate limits), one-off migration job,
# API, static web, and optionally ClamAV (`--profile antivirus`, needs ~1.5 GB RAM).
# TLS is terminated in front of this stack by the host nginx (+ Cloudflare) - see docs/DEPLOYMENT.md.
#
# CI/CD (normal way): GitHub Actions builds the images, pushes them to GHCR and runs deploy/deploy.sh on the
# server, which sets IMAGE_REGISTRY / IMAGE_TAG and pulls them.
# Manual build on the server (no registry):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
name: eavto

x-api-image: &api-build
  context: ..
  dockerfile: deploy/Dockerfile.api

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No "ports": the database is reachable only from this compose network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Counters only: no persistence needed, bounded memory.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s # first start downloads the signature database

  migrate:
    image: ${IMAGE_REGISTRY:-eavto}/e-avto-test-migrate:${IMAGE_TAG:-local}
    build: { <<: *api-build, target: migrate }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: ${IMAGE_REGISTRY:-eavto}/e-avto-test-api:${IMAGE_TAG:-local}
    build: { <<: *api-build, target: runtime }
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - media:/app/storage/private
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:5000:5000" # only the host nginx can reach it

  web:
    image: ${IMAGE_REGISTRY:-eavto}/e-avto-test-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: { VITE_API_URL: "${PUBLIC_API_URL:?set PUBLIC_API_URL in deploy/.env.production}" }
    restart: unless-stopped
    environment:
      # Goes into the CSP connect-src; empty would block every API call from the browser.
      API_ORIGIN: ${PUBLIC_API_ORIGIN:?set PUBLIC_API_ORIGIN in deploy/.env.production}
      API_UPSTREAM: http://api:5000
    depends_on: [api]
    ports:
      - "127.0.0.1:8080:80" # only the host nginx can reach it

volumes:
  pgdata:
  media:
  clamdb:
